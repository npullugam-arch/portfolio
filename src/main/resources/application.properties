spring.application.name=portfolio-cms

# Render provides PORT automatically
server.port=${PORT:8080}


# ===============================
# DATABASE - SUPABASE POSTGRESQL
# ===============================

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver


# ===============================
# HIKARI CONNECTION POOL
# ===============================

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Important when using Supabase transaction pooler
spring.datasource.hikari.data-source-properties.prepareThreshold=0


# ===============================
# JPA / HIBERNATE
# ===============================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Explicit PostgreSQL configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=true


# ===============================
# ADMIN LOGIN
# ===============================

portfolio.admin.username=${ADMIN_USERNAME}
portfolio.admin.password=${ADMIN_PASSWORD}
portfolio.admin.remember-me-key=${REMEMBER_ME_KEY}


# ===============================
# THYMELEAF
# ===============================

spring.thymeleaf.cache=${THYMELEAF_CACHE:false}


# ===============================
# SESSION / ERROR SECURITY
# ===============================

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax

server.error.include-message=never
server.error.include-stacktrace=never
