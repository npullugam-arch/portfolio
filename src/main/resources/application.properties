spring.application.name=portfolio-cms

# Render provides PORT automatically
server.port=${PORT:8080}

# ===============================
# DATABASE - SUPABASE POSTGRESQL
# ===============================

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / HIBERNATE
# ===============================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# ADMIN LOGIN
# ===============================

portfolio.admin.username=${ADMIN_USERNAME}
portfolio.admin.password=${ADMIN_PASSWORD}
portfolio.admin.remember-me-key=${REMEMBER_ME_KEY}

# ===============================
# THYMELEAF
# ===============================

spring.thymeleaf.cache=${THYMELEAF_CACHE:false}

# ===============================
# SESSION / ERROR SECURITY
# ===============================

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax

server.error.include-message=never
server.error.include-stacktrace=never