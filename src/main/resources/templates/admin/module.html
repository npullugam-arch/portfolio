<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="${#strings.capitalize(module)}+' · CMS'">Module</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body class="admin"><aside th:replace="~{admin/fragments :: sidebar}"></aside><main class="workspace"><header><div><p class="eyebrow">CONTENT MANAGER</p><h1 th:text="${#strings.capitalize(#strings.replace(module,'-',' '))}"></h1></div><a class="ghost" href="/admin/dashboard">Dashboard</a></header><div class="alert" th:if="${param.saved}">Content saved successfully.</div><div class="alert" th:if="${param.deleted}">Content moved to trash.</div><section class="split"><div class="panel"><h2>Add content</h2><form th:action="@{'/admin/'+${module}}" th:object="${item}" method="post"><label>Title<input th:field="*{title}" required maxlength="255"></label><label>Subtitle<input th:field="*{subtitle}"></label><label>Category<input th:field="*{category}"></label><label>Short description<textarea th:field="*{summary}" rows="3"></textarea></label><label>Full content<textarea th:field="*{description}" rows="6"></textarea></label><div class="two"><label>Image URL<input type="url" th:field="*{imageUrl}"></label><label>External URL<input type="url" th:field="*{externalUrl}"></label></div><div class="two"><label>Display order<input type="number" th:field="*{displayOrder}"></label><label class="check"><input type="checkbox" th:field="*{visible}"> Visible</label></div><button class="primary">Save content</button></form></div><div class="panel"><div class="panel-title"><h2>Published content</h2><form><input name="q" placeholder="Search…"></form></div><div class="empty" th:if="${items.empty}"><b>◇</b><h3>No content yet</h3><p>Create the first record using the form.</p></div><div class="item" th:each="row:${items.content}"><div><strong th:text="${row.title}"></strong><p th:text="${row.category ?: 'Uncategorized'}"></p></div><span class="badge" th:text="${row.visible ? 'Visible':'Hidden'}"></span><form th:action="@{'/admin/'+${module}+'/'+${row.id}+'/delete'}" method="post" onsubmit="return confirm('Move this item to trash?')"><button class="danger">Delete</button></form></div></div></section></main></body></html>
