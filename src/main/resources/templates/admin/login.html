<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin sign in</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body class="auth"><main class="login-card"><div class="brand">N<span>•</span> CMS</div><h1>Welcome back</h1><p>Sign in to manage your portfolio.</p><div class="alert error" th:if="${param.error}">Invalid username or password.</div><div class="alert" th:if="${param.logout}">You have been signed out.</div><form th:action="@{/admin/login}" method="post"><label>Username<input name="username" autocomplete="username" required autofocus></label><label>Password<input type="password" name="password" autocomplete="current-password" required></label><label class="check"><input type="checkbox" name="remember-me"> Keep me signed in</label><button class="primary" type="submit">Sign in</button></form><a href="/">← Back to portfolio</a></main></body></html>
