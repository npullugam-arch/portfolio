<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="_csrf" th:content="${_csrf.token}"><meta name="_csrf_header" th:content="${_csrf.headerName}"><title>Portfolio Manager · CMS</title><link rel="stylesheet" th:href="@{/css/app.css}"><style>.manager{display:grid;gap:20px}.manager form{display:grid;gap:14px}.manager textarea{min-height:110px}.rows{display:grid;gap:10px}.row{display:grid;grid-template-columns:1fr 1fr 90px auto;gap:8px;align-items:end;padding:12px;border:1px solid #ddd;border-radius:12px}.manager button{cursor:pointer}.manager [hidden]{display:none!important}.picker{display:flex;flex-wrap:wrap;gap:8px}.picker button.active{background:#111;color:#fff}.status{min-height:24px;color:#197246}</style></head><body class="admin"><aside th:replace="~{admin/fragments :: sidebar}"></aside><main class="workspace manager"><header><div><p class="eyebrow">CONTENT MANAGER</p><h1 id="pageTitle">Portfolio</h1></div><a class="ghost" href="/" target="_blank">View live site ↗</a></header><p class="status" id="status" role="status"></p>
<section class="panel" id="aboutPanel" hidden><h2>About Management</h2><form id="profileForm"><div class="two"><label>Full Name<input name="fullName" required></label><label>Professional Title<input name="professionalTitle"></label></div><label>Short Introduction<textarea name="shortIntro"></textarea></label><label>About Description<textarea name="description"></textarea></label><div class="two"><label>City<input name="city"></label><label>State<input name="state"></label></div><div class="two"><label>Country<input name="country"></label><label>Email<input name="email" type="email"></label></div><div class="two"><label>Phone<input name="phone"></label><label>Resume URL<input name="resumeUrl"></label></div><label>Profile image URL<input name="profileImageUrl"></label><button class="primary">Save profile</button></form><hr><h2>Skills</h2><form id="skillForm"><input name="id" type="hidden"><div class="two"><label>Skill Name<input name="name" required></label><label>Category<input name="category"></label></div><div class="two"><label>Icon URL<input name="iconUrl"></label><label>Display Order<input name="displayOrder" type="number" value="0"></label></div><button class="primary">Add / update skill</button></form><div class="rows" id="skillRows"></div></section>
<section class="panel" id="projectsPanel" hidden><div class="panel-title"><h2>Projects Management</h2><button class="primary" id="newProject" type="button">Add Project</button></div><div class="picker" id="projectPicker"></div><form id="projectForm"><input name="id" type="hidden"><h3>Basic information</h3><div class="two"><label>Project Name<input name="name" required></label><label>Slug<input name="slug" required></label></div><div class="two"><label>Short Title<input name="shortTitle"></label><label>Thumbnail URL<input name="thumbnailUrl"></label></div><label>Short Description<textarea name="shortDescription"></textarea></label><h3>Project details</h3><div class="two"><label>Title<input name="projectTitle"></label><label>Subtitle<input name="projectSubtitle"></label></div><label>Detailed Description<textarea name="detailedDescription"></textarea></label><div class="two"><label>Live View URL<input name="liveUrl"></label><label>GitHub Repository URL<input name="githubUrl"></label></div><div class="two"><label>Display Order<input name="displayOrder" type="number" value="0"></label><label class="check"><input name="published" type="checkbox" checked> Published</label></div><button class="primary">Save Project</button><button class="danger" id="deleteProject" type="button">Delete Project</button></form><div id="projectChildren" hidden><hr><h3>Technologies</h3><form id="technologyForm"><div class="two"><label>Technology<input name="technologyName" required></label><label>Order<input name="displayOrder" type="number" value="0"></label></div><button class="primary">Add Technology</button></form><div class="rows" id="technologyRows"></div><hr><h3>Media Gallery</h3><form id="mediaForm"><input name="id" type="hidden"><div class="two"><label>Media Type<select name="mediaType"><option>IMAGE</option><option>VIDEO</option></select></label><label>Media URL<input name="mediaUrl" required></label></div><div class="two"><label>Caption<input name="caption"></label><label>Order<input name="displayOrder" type="number" value="0"></label></div><button class="primary">Add / update media</button></form><div class="rows" id="mediaRows"></div></div></section>
<section class="panel" id="contactPanel" hidden><h2>Contact Management</h2><form id="contactForm"><div class="two"><label>Email<input name="email" type="email"></label><label>GitHub URL<input name="githubUrl"></label></div><div class="two"><label>LinkedIn URL<input name="linkedinUrl"></label><label>X / Twitter URL<input name="twitterUrl"></label></div><div class="two"><label>WhatsApp number / URL<input name="whatsapp"></label><label>Instagram URL<input name="instagramUrl"></label></div><label>Phone Number<input name="phone"></label><button class="primary">Save changes</button></form></section></main><script th:src="@{/js/portfolio-admin.js}"></script></body></html>
